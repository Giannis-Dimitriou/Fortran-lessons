<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fortran — Test Email</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6fb;color:#182230;margin:0;padding:20px}
main{max-width:650px;margin:auto;background:white;border:1px solid #d9dfeb;border-radius:16px;padding:22px}
h1{margin-top:0}label{display:block;font-weight:700;margin:15px 0 6px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cbd3e1;border-radius:8px;font:inherit}
.option{display:block;border:1px solid #d9dfeb;border-radius:9px;padding:10px;margin:8px 0;font-weight:400;cursor:pointer}
button{margin-top:16px;background:#315efb;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
#result{display:none;margin-top:18px;padding:14px;border-radius:10px}
.ok{background:#eaf7ef;border:1px solid #9bd5b4;color:#145b35}
.err{background:#fff0ef;border:1px solid #efaaa4;color:#8a1d16}
small{color:#667085}
</style>
</head>
<body>
<main>
<h1>🧪 Fortran — Test Email</h1>
<p>Μικρή δοκιμή μόνο για να ελέγξουμε τη σύνδεση με Web3Forms.</p>

<form id="form">
<label for="name">Ονοματεπώνυμο</label>
<input id="name" name="name" required placeholder="TEST ΦΟΙΤΗΤΗΣ">

<p><b>Ερώτηση:</b> Ποια είναι η σωστή δήλωση μιας ακέραιας μεταβλητής;</p>

<label class="option"><input type="radio" name="answer" value="integer :: x" required> integer :: x</label>
<label class="option"><input type="radio" name="answer" value="real :: x"> real :: x</label>
<label class="option"><input type="radio" name="answer" value="integer x"> integer x</label>

<button id="submitBtn" type="submit">Έλεγχος &amp; Αποστολή</button>
</form>

<div id="result"></div>
<p><small>Δεν αλλάζει τίποτα στο κανονικό quiz.</small></p>
</main>

<script>
// ΒΑΛΕ ΕΔΩ ΤΟ ΔΙΚΟ ΣΟΥ ACCESS KEY
const ACCESS_KEY = "22392efc-cbdc-4a66-96d9-5ca46d426084";

const form = document.getElementById("form");
const submitBtn = document.getElementById("submitBtn");
const result = document.getElementById("result");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  const answer = form.querySelector('input[name="answer"]:checked').value;
  const name = document.getElementById("name").value.trim();
  const correct = answer === "integer :: x";

  const formData = new FormData();
  formData.append("access_key", ACCESS_KEY);
  formData.append("name", name);
  formData.append("subject", "TEST — Fortran Web3Forms");
  formData.append(
    "message",
    "ΔΟΚΙΜΑΣΤΙΚΗ ΥΠΟΒΟΛΗ\\n\\n" +
    "Φοιτητής: " + name + "\\n" +
    "Απάντηση: " + answer + "\\n" +
    "Σωστή απάντηση: integer :: x\\n" +
    "Αποτέλεσμα: " + (correct ? "Σωστό" : "Λάθος")
  );

  submitBtn.disabled = true;
  submitBtn.textContent = "Αποστολή...";
  result.style.display = "block";
  result.className = "";
  result.textContent = "Γίνεται σύνδεση με Web3Forms...";

  try {
    const response = await fetch("https://api.web3forms.com/submit", {
      method: "POST",
      body: formData
    });

    const data = await response.json();

    if (response.ok && data.success) {
      result.className = "ok";
      result.innerHTML = "<b>✅ Επιτυχία!</b><br>Το Web3Forms δέχτηκε την υποβολή. Έλεγξε τώρα το email σου.";
    } else {
      result.className = "err";
      result.innerHTML = "<b>❌ Αποτυχία.</b><br>" + (data.message || "Δεν δόθηκε μήνυμα σφάλματος.");
      console.error("Web3Forms response:", data);
    }
  } catch (error) {
    result.className = "err";
    result.innerHTML = "<b>❌ Σφάλμα σύνδεσης.</b><br>" + error.message;
    console.error(error);
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = "Έλεγχος & Αποστολή";
  }
});
</script>
</body>
</html>
